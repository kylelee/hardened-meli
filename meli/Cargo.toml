[package]
name = "meli"
version = "0.10.0"
authors = ["Kyle Lee"]
edition = "2021"
rust-version = "1.88.0"
license = "EUPL-1.2 OR GPL-3.0-or-later"
description = "terminal e-mail client"
homepage = "https://github.com/kylelee/hardened-meli"
repository = "https://github.com/kylelee/hardened-meli"
keywords = ["mail", "mua", "maildir", "terminal", "imap"]
categories = ["command-line-utilities", "email"]
default-run = "meli"
exclude = ["/docs/historical-manpages"]

[lib]
name = "meli"
path = "src/lib.rs"

[[bin]]
name = "meli"
path = "src/main.rs"

[features]
default = [
    "sqlite3",
    "notmuch",
    "smtp",
    "http",
    "dbus-notifications",
    "gpgme",
    "cli-docs",
    "jmap",
    "static",
]
http = ["melib/http"]
notmuch = ["melib/notmuch"]
jmap = ["melib/jmap"]
sqlite3 = ["melib/sqlite3"]
smtp = ["melib/smtp"]
dbus-notifications = ["dep:notify-rust"]
cli-docs = ["dep:flate2"]
# svgscreenshot = ["dep:svg_crate"]
gpgme = ["melib/gpgme"]
# Static / vendoring features.
tls-static = ["melib/tls-static"]
http-static = ["melib/http-static"]
sqlite3-static = ["melib/sqlite3-static"]
dbus-static = ["dep:notify-rust", "notify-rust?/d_vendored"]
libz-static = ["dep:libz-sys", "libz-sys?/static"]
static = ["tls-static", "http-static", "sqlite3-static", "dbus-static", "libz-static"]

[dependencies]
aho-corasick = { version = "1.1.3" }
ammonia = { version = "4.1.4" }
bitflags = { workspace = true }
crossbeam = { version = "^0.8" }
crossterm = "0.29"
flate2 = { workspace = true }
futures = { workspace = true }
html2text = { version = "0.17" }
indexmap = { workspace = true }
itoa = { version = "1", default-features = false }
libc = { workspace = true }
libz-sys = { version = "1.1", features = ["static"], optional = true }
linkify = { version = "^0.10", default-features = false }
melib = { path = "../melib", version = "0.9.0", features = [] }
nix = { workspace = true, default-features = false, features = ["signal", "poll", "term", "ioctl", "process"] }
nucleo-matcher = "0.3.1"
ratatui = "0.30.2"
ratatui-textarea = { version = "0.9.2", default-features = false }
regex = { workspace = true }
serde = { workspace = true }
serde_derive = { workspace = true }
serde_json = { workspace = true }
signal-hook = { version = "^0.3", default-features = false, features = ["iterator"] }
signal-hook-registry = { version = "1.2.0", default-features = false }
smallvec = { workspace = true }
structopt = { version = "0.3.26", default-features = false }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "sync", "time"] }
# svg_crate = { version = "^0.13", optional = true, package = "svg" }
toml = { workspace = true }
toml_edit = { workspace = true }
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-appender = { version = "0.2", default-features = false }
tracing-subscriber = { version = "0.3", default-features = false, features = ["ansi", "fmt", "std"] }
unicode-width = { workspace = true }
url = "2"
xdg = { version = "2.1.0" }

[target.'cfg(target_os="linux")'.dependencies]
notify-rust = { version = ">=4.11, <4.18", default-features = false, features = ["dbus"], optional = true }

[target.'cfg(target_os="macos")'.dependencies]
notify-rust = { version = ">=4.11, <4.18", default-features = false }

[build-dependencies]
flate2 = { workspace = true, optional = true }
proc-macro2 = { version = "1.0.37" }
quote = { version = "^1.0" }
regex = { workspace = true }
syn = { version = "1", features = [] }

[dev-dependencies]
flate2 = { workspace = true }
regex = { workspace = true }
serde_test2 = { workspace = true }
tempfile = { workspace = true }
tokio-test = { workspace = true }
