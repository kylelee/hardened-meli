"mail.listing.plain.highlighted_selected" = { fg = "$bg", bg = "$accent", attrs = "Bold" }
"mail.listing.conversations" = { fg = "theme_default", bg = "$bg", attrs = "theme_default" }
"mail.listing.conversations.subject" = { fg = "theme_default", bg = "$bg", attrs = "Bold" }
"mail.listing.conversations.from" = { fg = "$func", bg = "$bg", attrs = "theme_default" }
