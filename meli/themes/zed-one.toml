# Ported from Zed editor built-in themes (https://github.com/zed-industries/zed, assets/themes/one).
#
# Install: copy this file into $XDG_CONFIG_HOME/meli/themes/ (usually
# ~/.config/meli/themes/) and pick a theme in meli with `:toggle theme`.
# One Dark (dark)
[terminal.themes."One Dark"]
"theme_default" = { fg = "$fg", bg = "$bg", attrs = "Default" }
"text.normal" = { fg = "theme_default", bg = "theme_default", attrs = "theme_default" }
"text.unfocused" = { fg = "$muted", bg = "theme_default", attrs = "Dim" }
"text.error" = { fg = "$error", bg = "theme_default", attrs = "Bold" }
"text.highlight" = { fg = "$bg", bg = "$warning", attrs = "Bold" }
"error_message" = { fg = "$error", bg = "theme_default", attrs = "Bold" }
"highlight" = { fg = "$bg", bg = "$warning", attrs = "Bold" }
"status.bar" = { fg = "$text", bg = "$status", attrs = "theme_default" }
"status.command_bar" = { fg = "$text", bg = "$surface", attrs = "theme_default" }
"status.history" = { fg = "$muted", bg = "$surface", attrs = "theme_default" }
"status.history.hints" = { fg = "$hint", bg = "$surface", attrs = "theme_default" }
"status.notification" = { fg = "$text", bg = "$status", attrs = "Bold" }
"tab.focused" = { fg = "$fg", bg = "$tab_active", attrs = "Bold" }
"tab.unfocused" = { fg = "$muted", bg = "$tab_inactive", attrs = "Dim" }
"tab.bar" = { fg = "$muted", bg = "$tab_bar", attrs = "theme_default" }
"widgets.list.header" = { fg = "$accent", bg = "theme_default", attrs = "Bold" }
"widgets.form.label" = { fg = "$func", bg = "theme_default", attrs = "Bold" }
"widgets.form.field" = { fg = "theme_default", bg = "$hover", attrs = "theme_default" }
"widgets.form.highlighted" = { fg = "$fg", bg = "$selected", attrs = "Bold" }
"widgets.options.highlighted" = { fg = "$fg", bg = "$selected", attrs = "Bold" }
"mail.sidebar" = { fg = "$muted", bg = "$panel", attrs = "theme_default" }
"mail.sidebar_divider" = { fg = "$border_variant", bg = "$panel", attrs = "theme_default" }
"mail.sidebar_account_name" = { fg = "$accent", bg = "$panel", attrs = "Bold" }
