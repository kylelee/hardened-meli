tab_active = "#23272e"
tab_inactive = "#1e2227"
hover = "#2c313a"
selected = "#2c313a"
border = "#3e4452"
border_variant = "#3e4452"
error = "#c24038"
warning = "#d19a66"
hint = "#7a849c"
match = "#51463d"
match_active = "#d19a66"
string = "#98c379"
