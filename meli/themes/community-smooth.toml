"mail.sidebar_highlighted_account" = { fg = "$text", bg = "$hover", attrs = "theme_default" }
"mail.listing.compact" = { fg = "theme_default", bg = "$bg", attrs = "theme_default" }
"mail.listing.compact.unseen" = { fg = "$string", bg = "$bg", attrs = "Bold" }
