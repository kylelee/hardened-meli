"mail.listing.tag_default" = { fg = "$bg", bg = "$attribute", attrs = "Bold" }
"mail.listing.highlight_self" = { fg = "$error", bg = "$match", attrs = "Underline" }
"mail.view.headers" = { fg = "$var_param", bg = "theme_default", attrs = "Bold" }
"mail.view.headers_names" = { fg = "$attribute", bg = "theme_default", attrs = "theme_default" }
"mail.view.body" = { fg = "theme_default", bg = "theme_default", attrs = "theme_default" }
"mail.view.thread.indentation.a" = { fg = "theme_default", bg = "$keyword", attrs = "theme_default" }
