#
#[pager]
#filter = "COLUMNS=72 /usr/local/bin/pygmentize -l email"
## Long lines wrap at the pager's visible width, however narrow: display width
## is measured (CJK characters count as two columns), words are never split
## mid-word, '/' and '-' offer soft break points, and only a unit wider than
## the window is hard-cut losslessly with the '⤷' marker; blank-line runs cap at two.
## HTML mail is rendered by the built-in HTML renderer by default: it is
## sanitized with an allow-list (ammonia) and converted to plain text
## (html2text) at the terminal's width, with no external dependency.
## Set html_filter to a command string to render HTML with an external
## program instead, e.g. w3m:
#html_filter = "w3m -I utf-8 -T text/html"
#pager_context = 0 # default, optional
#sticky_headers = true # default, optional
#
