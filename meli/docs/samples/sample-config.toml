## Setting up an IMAP account
#[accounts."imap"]
#root_mailbox = "INBOX"
#format = "imap"
#send_mail = { hostname = "smtp.example.com", port = 587, auth = { type = "auto", username = "user", password = { command = "gpg2 --no-tty -q -d ~/.passwords/user.gpg" } }, security = { type = "STARTTLS" } }
#server_hostname="mail.example.com"
#server_password="pha2hiLohs2eeeish2phaii1We3ood4chakaiv0hien2ahie3m"
#server_username="username@example.com"
##server_port="993" # imaps
#server_port="143" # STARTTLS
#use_starttls=true #optional
## IMAP IDLE watching: the watch connection is the only session holding the
## watched mailbox (INBOX), read-only; some servers stop pushing updates
## when a second session selects it.
#use_idle = true # default
## Heartbeat: seconds in IDLE before re-checking for new mail. On servers
## that never push (proprietary-push providers), THIS is the delivery path:
## lower it (e.g. 30-60) for faster listing updates, at slightly more traffic.
#idle_heartbeat_interval = 60 # default
## How often (seconds) the main connection examines the OTHER mailboxes.
#watch_sweep_interval = 300 # default
#listing.index_style = "Conversations"
#identity = "username@example.com"
#display_name = "Name Name"
### show only specific mailboxes, overriding the server's subscribed status.
##subscribed_mailboxes = ["INBOX", "INBOX/Sent", "INBOX/Drafts", "INBOX/Junk"]
#
## Setting up a QQ Mail account (imap.qq.com)
## NOTE: QQ Mail requires an IMAP/SMTP authorization code (授权码) instead of
## the account login password — generate one in QQ Mail settings under
## 账号 (account) -> POP3/IMAP/SMTP service, and use it as the password.
#[accounts."qq"]
#root_mailbox = "INBOX"
#format = "imap"
#send_mail = { hostname = "smtp.qq.com", port = 465, auth = { type = "auto", username = "yourname@qq.com", password = "your-authorization-code" }, security = { type = "tls" } }
#server_hostname = "imap.qq.com"
#server_username = "yourname@qq.com"
#server_password = "your-authorization-code"
#server_port = 993 # implicit TLS (imaps)
#identity = "yourname@qq.com"
#display_name = "Your Name"
#listing.index_style = "Conversations"
## Watching (see meli.conf(5) IMAP section):
## QQ does not push unsolicited IDLE updates to third-party clients; new mail
## is picked up by the heartbeat re-sync, so the defaults below work well:
#use_idle = true # default; watch connection is the only session holding INBOX
#idle_heartbeat_interval = 60 # default; lower (e.g. 30) = faster pickup, more traffic
#watch_sweep_interval = 300 # default; how often OTHER mailboxes are examined
#use_deflate = false # optional; QQ supports COMPRESS=DEFLATE, saves traffic
#
