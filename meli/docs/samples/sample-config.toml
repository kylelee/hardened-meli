## (both keys trigger the action). Special key names: `Up` `Down` `Left`
## `Right` `Home` `End` `PageUp` `PageDown` `Backspace` `Delete` `Insert`
## `Esc` `Enter` `Tab` `Space` `F1`..`F12`; modifiers `C-<char>` `M-<char>`;
## plain characters are written as-is (`j`, `k`, `?`).
