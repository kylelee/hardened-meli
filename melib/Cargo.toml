[package]
name = "melib"
version = "0.9.0"
authors = ["Kyle Lee"]
homepage = "https://github.com/kylelee/hardened-meli"
repository = "https://github.com/kylelee/hardened-meli"
description = "library for e-mail clients and other e-mail applications"
keywords = ["mail", "mua", "maildir", "imap", "jmap"]
categories = ["email", "parser-implementations"]
license = "EUPL-1.2 OR GPL-3.0-or-later"
edition = "2021"
build = "build.rs"
rust-version = "1.85.0"

[lib]
name = "melib"
path = "src/lib.rs"

[features]
default = ["imap", "nntp", "maildir", "mbox-notify", "smtp"]

gpgme = []
http = ["isahc", "url/serde"]
http-static = ["isahc", "isahc/static-curl"]
imap = ["imap-codec", "imap-types", "tls"]
jmap = ["http"]
nntp = ["tls"]
maildir = ["notify"]
mbox-notify = ["notify"]
notmuch = ["maildir"]
smtp = ["tls"]
sqlite3 = ["sqlite3-static"]
sqlite3-static = ["rusqlite", "rusqlite/bundled-full"]
tls = ["native-tls"]
tls-static = ["tls", "native-tls/vendored"]

[dependencies]
async-fn-stream = { version = "0.3" }
async-io = { version = "2" }
base64 = { version = "0.23" }
bitflags = { workspace = true }
cfg-if = { version = "^1.0.0" }
chrono = { version = "^0.4", default-features = false }
data-encoding = { version = "2.11" }
# encoding_rs 0.8.40+ requires rustc 1.88, above this crate's MSRV (1.85).
encoding_rs = { version = "=0.8.35" }
flate2 = { workspace = true }
futures = { workspace = true }
imap-codec = { workspace = true, optional = true }
imap-types = { workspace = true, optional = true }
indexmap = { workspace = true }
isahc = { workspace = true, optional = true }
libc = { workspace = true }
# libloading 0.9 requires rustc 1.88, above this crate's MSRV (1.85).
libloading = { version = "0.8" }
native-tls = { version = "0.2", default-features = false, optional = true }
nix = { workspace = true, default-features = false, features = ["fs", "socket", "dir", "hostname"] }
nom = { version = "8" }
notify = { version = "8", optional = true }
polling = { version = "3" }
regex = { workspace = true }
rusqlite = { workspace = true, optional = true }
serde = { workspace = true, features = ["rc"] }
serde_derive = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }
serde_path_to_error = { version = "0.1" }
smallvec = { workspace = true }
smol = { workspace = true }
socket2 = { workspace = true }
# `release_max_level_error` compiles every `tracing` event below `ERROR`
# out of release builds entirely — zero formatting or branch cost; debug
# builds log normally (to `./log/` by default).
tracing = { workspace = true, features = ["release_max_level_error"] }
unicode-segmentation = { version = "1.13", default-features = false }
unicode-width = { workspace = true }
url = { workspace = true, optional = true }
# uuid 1.27+ requires rustc 1.89, above this crate's MSRV (1.85).
uuid = { version = "=1.26.1", features = ["serde", "v4", "v5"] }
xdg = { workspace = true }

[dev-dependencies]
serde_test2 = { workspace = true }
tempfile = { workspace = true }
tokio-test = { workspace = true }
toml = { workspace = true }
