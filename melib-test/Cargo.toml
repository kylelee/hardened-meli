# SPDX-License-Identifier: EUPL-1.2 OR GPL-3.0-or-later

[package]
name = "melib-test"
version = "0.9.0"
authors = ["Kyle Lee"]
edition = "2021"
rust-version = "1.85.0"
license = "EUPL-1.2 OR GPL-3.0-or-later"
description = "Integration test suite for the melib e-mail library"
homepage = "https://github.com/kylelee/hardened-meli"
repository = "https://github.com/kylelee/hardened-meli"
keywords = ["mail", "testing"]
categories = ["email", "development-tools::testing"]

[lib]
name = "melib_test"
path = "src/lib.rs"

[features]
default = ["imap", "jmap", "maildir", "notmuch", "smtp", "sqlite3"]
imap = ["dep:imap-codec", "dep:imap-types", "melib/imap"]
jmap = ["dep:isahc", "dep:url", "melib/jmap"]
maildir = ["melib/maildir"]
notmuch = ["melib/notmuch"]
smtp = ["melib/smtp"]
sqlite3 = ["dep:rusqlite", "melib/sqlite3"]

[dependencies]
flate2 = { workspace = true }
futures = { workspace = true }
imap-codec = { workspace = true, optional = true }
imap-types = { workspace = true, optional = true }
indexmap = { workspace = true }
isahc = { workspace = true, optional = true }
melib = { path = "../melib" }
nix = { workspace = true }
regex = { workspace = true }
rusqlite = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
serde_derive = { workspace = true }
serde_json = { workspace = true }
smol = { workspace = true }
socket2 = { workspace = true }
tempfile = { workspace = true }
tokio-test = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
url = { workspace = true, optional = true }
